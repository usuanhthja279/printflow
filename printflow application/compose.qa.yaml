# Independent local-only QA stack. Starts alongside DEV with separate DB and ports.
# Run: Copy-Item .env.qa.example .env.qa; edit credentials; docker compose -f compose.qa.yaml --env-file .env.qa up --build -d
name: printflow-qa
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printflow_qa}
      POSTGRES_USER: ${POSTGRES_USER:-printflow_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set QA DB password}
    volumes:
      - printflow_qa_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-printflow_qa}
      DB_USERNAME: ${POSTGRES_USER:-printflow_qa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set QA DB password}
      APP_DEMO_ENABLED: "true"
      APP_DEMO_KEY: ${DEMO_ADMIN_KEY:?Set QA demo key}
      APP_PUBLIC_ENQUIRIES_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
volumes:
  printflow_qa_db:
